[project]
name = "django-display-ids"
version = "0.1.2"
description = "Stripe-like prefixed IDs for Django. Works with existing UUIDs — no schema changes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "ISC" }
keywords = [
    "django",
    "stripe",
    "uuid",
    "base62",
    "prefixed-id",
    "drf",
    "shortuuid",
    "nanoid",
    "ulid",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "License :: OSI Approved :: ISC License (ISCL)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "django>=4.2",
]

[project.urls]
Homepage = "https://joseph.is/django-display-ids"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "djangorestframework>=3.14",
    "shortuuid>=1.0",
    "nox>=2024.0",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented out code)
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "ARG001", # unused function argument (common in Django)
    "ARG002", # unused method argument (common in Django)
]

[tool.ruff.lint.isort]
known-first-party = ["django_display_ids"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
