repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false

      - id: changelog-version
        name: changelog has entry for current version
        entry: sh -c 'ver=$(python -c "import tomllib; print(tomllib.load(open(\"pyproject.toml\",\"rb\"))[\"project\"][\"version\"])") && grep -q "## $ver" CHANGELOG.md || { echo "CHANGELOG.md missing entry for $ver"; exit 1; }'
        language: system
        files: ^(pyproject\.toml|CHANGELOG\.md)$
        pass_filenames: false

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.5.24
    hooks:
      - id: uv-lock
